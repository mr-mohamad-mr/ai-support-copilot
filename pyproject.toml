[project]
name = "ai-support-copilot"
version = "0.2.0"
description = "Multi-tenant AI support platform: answers from each tenant's own documents, with citations and human handoff."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "S101",  # assert is how pytest tests are written
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "S603", "S607"]  # test passwords, node subprocess
"scripts/*" = ["S311"]  # synthetic benchmark text, not security

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
